<style>
  :root {
    --bg: #F7F7F5; --panel: #FFFFFF; --ink: #1D1D1D; --muted: #6B6B66;
    --line: #E3E3DE; --hover: #EFEFEA; --accent: #1F5FA8; --dim: #C9C9C3;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #151515; --panel: #1F1F1F; --ink: #EDEDEA; --muted: #A0A09A;
      --line: #333331; --hover: #2A2A28; --accent: #6FA8E8; --dim: #4A4A47;
    }
  }
  :root[data-theme="dark"] {
    --bg: #151515; --panel: #1F1F1F; --ink: #EDEDEA; --muted: #A0A09A;
    --line: #333331; --hover: #2A2A28; --accent: #6FA8E8; --dim: #4A4A47;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body { background: var(--bg); color: var(--ink); font: 14px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif; }
  .app { display: grid; grid-template-columns: 300px 1fr; height: 100vh; }
  aside { background: var(--panel); border-right: 1px solid var(--line); display: flex; flex-direction: column; min-height: 0; }
  header { padding: 16px 16px 8px; }
  h1 { font-size: 16px; margin: 0 0 2px; }
  .sub { color: var(--muted); font-size: 12px; margin: 0; }
  .tools { display: flex; gap: 6px; padding: 8px 16px; border-bottom: 1px solid var(--line); }
  .tools input { flex: 1; min-width: 0; padding: 6px 8px; border: 1px solid var(--line); border-radius: 6px; background: var(--bg); color: var(--ink); font: inherit; }
  .tools button { padding: 6px 8px; border: 1px solid var(--line); border-radius: 6px; background: var(--panel); color: var(--ink); cursor: pointer; font: inherit; font-size: 12px; }
  .tools button:hover { background: var(--hover); }
  ul { list-style: none; margin: 0; padding: 6px 8px; overflow-y: auto; flex: 1; }
  li label { display: flex; align-items: center; gap: 8px; padding: 6px 8px; border-radius: 6px; cursor: pointer; }
  li label:hover { background: var(--hover); }
  li input { accent-color: var(--accent); margin: 0; }
  .sw { width: 10px; height: 10px; border-radius: 3px; flex: none; }
  .name { flex: 1; }
  .range { color: var(--muted); font-size: 11px; font-variant-numeric: tabular-nums; }
  footer { padding: 10px 16px; border-top: 1px solid var(--line); color: var(--muted); font-size: 12px; }
  #map { height: 100%; background: var(--bg); }
  .leaflet-tooltip { font: 12px/1.4 system-ui, sans-serif; }
  .tt b { display: block; font-size: 13px; }
  @media (max-width: 720px) {
    .app { grid-template-columns: 1fr; grid-template-rows: auto 1fr; }
    aside { max-height: 42vh; border-right: 0; border-bottom: 1px solid var(--line); }
  }
</style>
</head>

,[-50.8403,-29.9768],[-50.8365,-29.9791],[-50.836,-29.9808],[-50.834,-29.9825],[-50.8338,-29.9832],[-50.8313,-29.9874],[-50.8301,-29.9887],[-50.8303,-29.9896],[-50.8208,-29.9988],[-50.7909,-29.9953],[-50.7673,-29.9922],[-50.7514,-29.9877],[-50.7439,-29.9865],[-50.7359,-29.982],[-50.7316,-29.9807],[-50.7259,-29.9804],[-50.7179,-29.9789],[-50.7068,-29.977],[-50.7023,-29.9755],[-50.6999,-29.9731],[-50.6987,-29.9697],[-50.6988,-29.967],[-50.6972,-29.9648],[-50.6863,-29.9554],[-50.6856,-29.9525],[-50.687,-29.9489],[-50.6906,-29.9462],[-50.701,-29.9428],[-50.7042,-29.9407],[-50.7062,-29.9262],[-50.7039,-29.9217],[-50.694,-29.9134],[-50.6941,-29.9116],[-50.6915,-29.9046],[-50.6838,-29.8955],[-50.6791,-29.8865],[-50.6794,-29.8802],[-50.6813,-29.8804],[-50.681,-29.8771],[-50.6837,-29.8736],[-50.6796,-29.8677],[-50.6807,-29.8641],[-50.6793,-29.8624],[-50.6804,-29.8604],[-50.6799,-29.8567],[-50.6828,-29.8514],[-50.6823,-29.8467],[-50.6841,-29.8467],[-50.6854,-29.8441],[-50.6848,-29.8405],[-50.6853,-29.8392],[-50.6876,-29.8394],[-50.691,-29.8373],[-50.6931,-29.8391],[-50.6937,-29.839],[-50.6956,-29.835],[-50.6988,-29.8331],[-50.7004,-29.8289],[-50.7089,-29.8239],[-50.7114,-29.8237],[-50.715,-29.8255],[-50.7217,-29.8189],[-50.7248,-29.8185],[-50.7307,-29.8146],[-50.7341,-29.8136],[-50.7352,-29.8114],[-50.7352,-29.808],[-50.7375,-29.8069],[-50.7385,-29.8053],[-50.7418,-29.8054],[-50.7438,-29.8036],[-50.7448,-29.7956],[-50.7491,-29.7936],[-50.7494,-29.7901],[-50.7521,-29.7888],[-50.7509,-29.7865],[-50.7497,-29.7864],[-50.748,-29.7844],[-50.7403,-29.782],[-50.7292,-29.7851],[-50.7197,-29.7907],[-50.7118,-29.7882],[-50.7039,-29.7894],[-50.701,-29.7913],[-50.6992,-29.7959],[-50.6937,-29.7901]]]},"properties":{"ibge":4309050,"nome":"Glorinha"}}]};
const PALETTE = ['#1F5FA8','#D9822B','#2E9E6A','#C2410C','#7C3AED','#0E7490','#B91C1C','#65A30D','#DB2777','#A16207','#4F46E5','#0F766E','#9333EA','#EA580C'];

const cities = CEPS.map((c, i) => ({ ...c, color: PALETTE[i % PALETTE.length] }));
const byName = Object.fromEntries(cities.map(c => [c.cidade, c]));
const selected = new Set(['Porto Alegre']);

const css = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const map = L.map('map', { zoomControl: true }).setView([-30.0, -51.15], 10);
L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
  attribution: '&copy; OpenStreetMap · limites: IBGE', maxZoom: 18
}).addTo(map);

const fmtRange = c => c.ini === c.fim ? c.ini : `${c.ini} a ${c.fim}`;
const style = f => {
  const c = byName[f.properties.nome], on = selected.has(c.cidade);
  return on
    ? { color: c.color, weight: 2, fillColor: c.color, fillOpacity: 0.35, dashArray: null }
    : { color: css('--dim'), weight: 1, fillColor: css('--dim'), fillOpacity: 0.08, dashArray: '3 3' };
};

const layer = L.geoJSON(GEO, {
  style,
  onEachFeature: (f, l) => {
    const c = byName[f.properties.nome];
    l.bindTooltip(`<div class="tt"><b>${c.cidade}</b>CEP: ${fmtRange(c)}<br>${c.tipo}</div>`, { sticky: true });
    l.on('click', () => toggle(c.cidade));
  }
}).addTo(map);

const list = document.getElementById('list');
cities.forEach(c => {
  const li = document.createElement('li');
  li.dataset.name = c.cidade.toLowerCase();
  li.innerHTML = `<label><input type="checkbox" value="${c.cidade}"><span class="sw" style="background:${c.color}"></span><span class="name">${c.cidade}</span><span class="range">${c.ini.slice(0,5)}${c.ini === c.fim ? '' : '–' + c.fim.slice(0,5)}</span></label>`;
  li.querySelector('input').addEventListener('change', e => toggle(c.cidade, e.target.checked));
  list.appendChild(li);
});

function toggle(name, force) {
  const on = force ?? !selected.has(name);
  on ? selected.add(name) : selected.delete(name);
  render(true);
}

function render(fit) {
  layer.setStyle(style);
  layer.eachLayer(l => { if (selected.has(l.feature.properties.nome)) l.bringToFront(); });
  list.querySelectorAll('input').forEach(i => { i.checked = selected.has(i.value); });
  const n = selected.size;
  document.getElementById('summary').textContent =
    n === 0 ? 'Nenhum município selecionado' : `${n} de ${cities.length} municípios selecionados`;
  if (fit) {
    const ls = []; layer.eachLayer(l => { if (selected.has(l.feature.properties.nome)) ls.push(l); });
    const b = ls.length ? L.featureGroup(ls).getBounds() : layer.getBounds();
    map.fitBounds(b, { padding: [24, 24], maxZoom: 12 });
  }
}

document.getElementById('all').onclick = () => { cities.forEach(c => selected.add(c.cidade)); render(true); };
document.getElementById('none').onclick = () => { selected.clear(); render(true); };
document.getElementById('q').addEventListener('input', e => {
  const q = e.target.value.trim().toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '');
  list.querySelectorAll('li').forEach(li => {
    const n = li.dataset.name.normalize('NFD').replace(/[̀-ͯ]/g, '');
    li.hidden = q && !n.includes(q);
  });
});
matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => render(false));
render(true);
</script>

</html>
